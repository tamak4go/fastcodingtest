<svg xmlns="http://www.w3.org/2000/svg" width="38" height="38" viewBox="0 0 38 38" fill="none">
  <!-- Gold coin with orange $ in center -->
  <circle cx="14" cy="10" r="8" fill="#FBBF24"/>
  <circle cx="14" cy="10" r="6.2" fill="#FDE68A"/>
  <text x="14" y="13.2" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#F05A35" text-anchor="middle">$</text>

  <!-- 3 Rising Growing Stock Arrows -->
  <!-- Left Arrow (Short) -->
  <rect x="5.5" y="25" width="4.5" height="10" rx="1" fill="#F05A35"/>
  <polygon points="7.75,19 3,25 12.5,25" fill="#F05A35"/>

  <!-- Middle Arrow (Medium) -->
  <rect x="14" y="20" width="4.5" height="15" rx="1" fill="#F05A35"/>
  <polygon points="16.25,14 11.5,20 21,20" fill="#F05A35"/>

  <!-- Right Arrow (Tall) -->
  <rect x="22.5" y="15" width="4.5" height="20" rx="1" fill="#F05A35"/>
  <polygon points="24.75,9 20,15 29.5,15" fill="#F05A35"/>
</svg>
